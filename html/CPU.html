<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CPU Matrix Multiplication Step-by-Step</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h2 { color: #f43f5e; margin-bottom: 5px; }
    p.sub { color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 20px; }

    .controls { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
    button { padding: 10px 18px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; background: #f43f5e; color: white; border-radius: 6px; transition: 0.2s; }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #fb7185; }
    .step-badge { font-size: 15px; font-weight: bold; color: #f59e0b; background: #1e293b; padding: 8px 16px; border-radius: 6px; border: 1px solid #334155; }

    .main-board { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 800px; }
    
    /* 메모리 영역 */
    .memory-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: flex; justify-content: space-around; align-items: center; position: relative; }
    .matrix-box { text-align: center; }
    .matrix-box h4 { margin: 0 0 10px 0; color: #cbd5e1; font-size: 14px; }
    
    .matrix-table { border-collapse: collapse; background: #0f172a; border-radius: 6px; overflow: hidden; }
    .matrix-table td { width: 45px; height: 45px; border: 1px solid #334155; text-align: center; font-size: 16px; font-weight: bold; font-family: monospace; transition: all 0.3s ease; }
    
    /* 하이라이트 스타일 */
    td.read-focus { background: #f59e0b; color: #0f172a; transform: scale(1.15); border-color: #fbbf24; box-shadow: 0 0 12px rgba(245,158,11,0.8); z-index: 10; }
    td.write-focus { background: #22c55e; color: #0f172a; transform: scale(1.15); border-color: #4ade80; box-shadow: 0 0 12px rgba(34,197,94,0.8); z-index: 10; }

    /* CPU 코어 및 ALU */
    .cpu-core { background: #1e293b; border: 2px solid #f43f5e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .alu-box { background: #0f172a; border: 2px dashed #f43f5e; border-radius: 8px; width: 100%; padding: 15px; box-sizing: border-box; text-align: center; min-height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .alu-title { font-size: 12px; color: #f43f5e; font-weight: bold; margin-bottom: 5px; }
    .alu-formula { font-size: 20px; font-family: monospace; font-weight: bold; color: #38bdf8; }

    .stat-bar { display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: #94a3b8; background: #0f172a; padding: 10px 15px; border-radius: 6px; box-sizing: border-box; }
    .stat-item b { color: #f59e0b; }

    .desc-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; font-size: 14px; line-height: 1.6; color: #cbd5e1; min-height: 50px; }
    .hl-num { color: #f59e0b; font-weight: bold; background: #334155; padding: 2px 6px; border-radius: 4px; }
    .hl-out { color: #22c55e; font-weight: bold; background: #334155; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>CPU 행렬 곱 연산 메모리 접근 스텝 시각화</h2>
  <p class="sub">CPU가 DRAM/캐시에서 숫자를 읽고(Read) 계산 후 쓰기(Write)하는 과정</p>

  <div class="controls">
    <button id="prevBtn" onclick="changeStep(-1)" disabled>◀ 이전 스텝</button>
    <span class="step-badge" id="stepLabel">Step 1 / 12</span>
    <button id="nextBtn" onclick="changeStep(1)">다음 스텝 ▶</button>
    <button id="autoBtn" onclick="toggleAuto()">자동 재생 ▶</button>
  </div>

  <div class="main-board">
    <!-- 메모리 영역 (X, W, Y) -->
    <div class="memory-section">
      <div class="matrix-box">
        <h4>입력 행렬 X (Memory)</h4>
        <table class="matrix-table">
          <tr><td id="x00">5</td><td id="x01">7</td></tr>
          <tr><td id="x10">6</td><td id="x11">8</td></tr>
        </table>
      </div>

      <div style="font-size: 20px; font-weight: bold; color: #64748b;">×</div>

      <div class="matrix-box">
        <h4>가중치 행렬 W (Memory)</h4>
        <table class="matrix-table">
          <tr><td id="w00">1</td><td id="w01">3</td></tr>
          <tr><td id="w10">2</td><td id="w11">4</td></tr>
        </table>
      </div>

      <div style="font-size: 20px; font-weight: bold; color: #64748b;">=</div>

      <div class="matrix-box">
        <h4>결과 행렬 Y (Memory)</h4>
        <table class="matrix-table">
          <tr><td id="y00">0</td><td id="y01">0</td></tr>
          <tr><td id="y10">0</td><td id="y11">0</td></tr>
        </table>
      </div>
    </div>

    <!-- CPU 및 ALU 영역 -->
    <div class="cpu-core">
      <div class="stat-bar">
        <span class="stat-item">현재 누적기(Accumulator): <b id="accVal">0</b></span>
        <span class="stat-item">총 메모리 접근 횟수: <b id="memAccessCount">0회</b></span>
      </div>

      <div class="alu-box">
        <div class="alu-title">CPU ALU (Arithmetic Logic Unit)</div>
        <div class="alu-formula" id="aluFormula">대기 중...</div>
      </div>
    </div>

    <!-- 스텝 설명 -->
    <div class="desc-box" id="descText">설명 대기 중...</div>
  </div>

<script>
let currentStep = 0;
let timer = null;

// CPU 연산 스텝 데이터 정의 (Read/Write 강조 및 ALU 연산 상세)
const steps = [
  // Y[0,0] 계산 (1~3)
  {
    read: ['x00', 'w00'],
    write: [],
    acc: 5,
    access: 2,
    formula: "5 × 1 = 5",
    desc: "<b>[Read]</b> Y[0,0]을 구하기 위해 메모리에서 <span class='hl-num'>X[0,0]=5</span> 와 <span class='hl-num'>W[0,0]=1</span> 로드 ➔ 곱셈 연산 후 누적기(Acc)에 저장 (Acc = 5)"
  },
  {
    read: ['x01', 'w10'],
    write: [],
    acc: 19,
    access: 4,
    formula: "5 + (7 × 2) = 19",
    desc: "<b>[Read & Acc]</b> 메모리에서 <span class='hl-num'>X[0,1]=7</span> 과 <span class='hl-num'>W[1,0]=2</span> 추가 로드 ➔ 곱한 값(14)을 기존 Acc(5)에 더함 (Acc = 19)"
  },
  {
    read: [],
    write: ['y00'],
    acc: 0,
    access: 5,
    formula: "Y[0,0] ➔ 19 저장 완료",
    desc: "<b>[Write]</b> 누적기 연산 결과인 <span class='hl-out'>19</span>를 메모리의 <span class='hl-out'>Y[0,0]</span> 위치에 기록하고 누적기를 초기화합니다."
  },

  // Y[0,1] 계산 (4~6)
  {
    read: ['x00', 'w01'],
    write: [],
    acc: 15,
    access: 7,
    formula: "5 × 3 = 15",
    desc: "<b>[Read - 중복 접근]</b> Y[0,1] 계산을 위해 아까 읽었던 <span class='hl-num'>X[0,0]=5</span>를 <b>메모리에서 다시 읽고</b> <span class='hl-num'>W[0,1]=3</span> 로드 ➔ (Acc = 15)"
  },
  {
    read: ['x01', 'w11'],
    write: [],
    acc: 43,
    access: 9,
    formula: "15 + (7 × 4) = 43",
    desc: "<b>[Read & Acc]</b> 메모리에서 <span class='hl-num'>X[0,1]=7</span> 과 <span class='hl-num'>W[1,1]=4</span> 추가 로드 ➔ 곱한 값(28)을 Acc에 더함 (Acc = 43)"
  },
  {
    read: [],
    write: ['y01'],
    acc: 0,
    access: 10,
    formula: "Y[0,1] ➔ 43 저장 완료",
    desc: "<b>[Write]</b> 연산 결과 <span class='hl-out'>43</span>을 메모리의 <span class='hl-out'>Y[0,1]</span> 위치에 기록합니다."
  },

  // Y[1,0] 계산 (7~9)
  {
    read: ['x10', 'w00'],
    write: [],
    acc: 6,
    access: 12,
    formula: "6 × 1 = 6",
    desc: "<b>[Read]</b> Y[1,0] 계산 시작 ➔ 메모리에서 <span class='hl-num'>X[1,0]=6</span> 과 <span class='hl-num'>W[0,0]=1</span> 로드 (Acc = 6)"
  },
  {
    read: ['x11', 'w10'],
    write: [],
    acc: 22,
    access: 14,
    formula: "6 + (8 × 2) = 22",
    desc: "<b>[Read & Acc]</b> 메모리에서 <span class='hl-num'>X[1,1]=8</span> 과 <span class='hl-num'>W[1,0]=2</span> 로드 ➔ 곱한 값(16)을 기존 Acc에 더함 (Acc = 22)"
  },
  {
    read: [],
    write: ['y10'],
    acc: 0,
    access: 15,
    formula: "Y[1,0] ➔ 22 저장 완료",
    desc: "<b>[Write]</b> 연산 결과 <span class='hl-out'>22</span>를 메모리의 <span class='hl-out'>Y[1,0]</span> 위치에 기록합니다."
  },

  // Y[1,1] 계산 (10~12)
  {
    read: ['x10', 'w01'],
    write: [],
    acc: 18,
    access: 17,
    formula: "6 × 3 = 18",
    desc: "<b>[Read - 중복 접근]</b> Y[1,1] 계산을 위해 <span class='hl-num'>X[1,0]=6</span> 과 <span class='hl-num'>W[0,1]=3</span> 로드 (Acc = 18)"
  },
  {
    read: ['x11', 'w11'],
    write: [],
    acc: 56,
    access: 19,
    formula: "18 + (8 × 4) = 56",
    desc: "<b>[Read & Acc]</b> 메모리에서 <span class='hl-num'>X[1,1]=8</span> 과 <span class='hl-num'>W[1,1]=4</span> 로드 ➔ 곱한 값(32)을 더함 (Acc = 56)"
  },
  {
    read: [],
    write: ['y11'],
    acc: 0,
    access: 20,
    formula: "Y[1,1] ➔ 56 저장 완료",
    desc: "<b>[Write - 완료]</b> 최종 결과 <span class='hl-out'>56</span>을 <span class='hl-out'>Y[1,1]</span>에 쓰고 종료합니다. (총 <b>20회</b>의 메모리 접근 발생)"
  }
];

// 메모리 결과 기록용 누적 데이터
const currentY = { y00: 0, y01: 0, y10: 0, y11: 0 };

function clearHighlights() {
  const allTd = document.querySelectorAll('.matrix-table td');
  allTd.forEach(td => td.className = '');
}

function updateUI() {
  clearHighlights();
  const data = steps[currentStep];

  // 라벨 업데이트
  document.getElementById('stepLabel').innerText = `Step ${currentStep + 1} / ${steps.length}`;
  document.getElementById('descText').innerHTML = data.desc;
  document.getElementById('aluFormula').innerText = data.formula;
  document.getElementById('accVal').innerText = data.acc;
  document.getElementById('memAccessCount').innerText = `${data.access}회`;

  // Read 셀 하이라이트 (주황색)
  data.read.forEach(id => {
    document.getElementById(id).classList.add('read-focus');
  });

  // Write 셀 하이라이트 (초록색) 및 값 반영
  data.write.forEach(id => {
    const el = document.getElementById(id);
    el.classList.add('write-focus');
    if (id === 'y00') currentY.y00 = 19;
    if (id === 'y01') currentY.y01 = 43;
    if (id === 'y10') currentY.y10 = 22;
    if (id === 'y11') currentY.y11 = 56;
  });

  // 이전 스텝으로 되돌아갈 때 Y 값 복원 처리
  if (currentStep < 2) currentY.y00 = 0;
  if (currentStep < 5) currentY.y01 = 0;
  if (currentStep < 8) currentY.y10 = 0;
  if (currentStep < 11) currentY.y11 = 0;

  document.getElementById('y00').innerText = currentY.y00;
  document.getElementById('y01').innerText = currentY.y01;
  document.getElementById('y10').innerText = currentY.y10;
  document.getElementById('y11').innerText = currentY.y11;

  // 버튼 상태
  document.getElementById('prevBtn').disabled = currentStep === 0;
  document.getElementById('nextBtn').disabled = currentStep === steps.length - 1;
}

function changeStep(dir) {
  currentStep += dir;
  if (currentStep < 0) currentStep = 0;
  if (currentStep >= steps.length) currentStep = steps.length - 1;
  updateUI();
}

function toggleAuto() {
  const btn = document.getElementById('autoBtn');
  if (timer) {
    clearInterval(timer);
    timer = null;
    btn.innerText = "자동 재생 ▶";
  } else {
    btn.innerText = "일시 정지 ❚❚";
    timer = setInterval(() => {
      if (currentStep < steps.length - 1) {
        changeStep(1);
      } else {
        currentStep = 0;
        updateUI();
      }
    }, 2000);
  }
}

// 초기 로드
updateUI();
</script>
</body>
</html>
